name: Update Data

on:
  schedule:
    - cron: '0 9 * * 1'   # toda segunda, 9h UTC — ajuste como preferir
  workflow_dispatch:        # também permite disparar manualmente pelo GitHub
    inputs:
      dataset_version:
        description: 'Versão específica do dataset Kaggle (deixe vazio pra pegar a mais recente)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Verifica se o dataset do Kaggle tem versão nova
        id: check
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.dataset_version }}" ]; then
            echo "Versão específica solicitada manualmente: ${{ github.event.inputs.dataset_version }} -- pulando checagem normal"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "remote_version=${{ github.event.inputs.dataset_version }}" >> "$GITHUB_OUTPUT"
          else
            python check_dataset_version.py
          fi

      # A partir daqui, todos os steps só rodam se houver versão nova --
      # evita gastar minutos do Actions e gerar release vazia à toa.

      - name: Baixa football.db da última release (preserva avatares manuais)
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p clean
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          echo "Baixando football.db da release: $LATEST_TAG"
          gh release download "$LATEST_TAG" --pattern "football.db" --dir clean/ --clobber
          cp clean/football.db clean/football_previous.db

      - name: Baixa CSVs do Kaggle (versão específica ou a mais recente)
        if: steps.check.outputs.has_update == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.dataset_version }}" ]; then
            python download_dataset.py --version ${{ github.event.inputs.dataset_version }}
          else
            python download_dataset.py
          fi

      - name: Roda pipeline (sem --force, preserva avatares manuais e automáticos)
        if: steps.check.outputs.has_update == 'true'
        run: python pipeline.py

      - name: Valida qualidade do dataset antes de publicar
        if: steps.check.outputs.has_update == 'true'
        id: validate
        run: python validate_release.py

      - name: Publica nova release com o banco atualizado
        if: steps.check.outputs.has_update == 'true' && steps.validate.outputs.validation_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="data-v${{ steps.check.outputs.remote_version }}"
          gh release create "$TAG" \
            clean/football.db \
            --title "Data update: dataset versão ${{ steps.check.outputs.remote_version }}" \
            --notes "Atualizado automaticamente via GitHub Actions a partir da versão ${{ steps.check.outputs.remote_version }} do dataset Kaggle."

      - name: Atualiza o estado de versão processada
        if: steps.check.outputs.has_update == 'true' && steps.validate.outputs.validation_passed == 'true' && github.event.inputs.dataset_version == ''
        run: |
          python -c "
          import json
          from pathlib import Path
          Path('.last_processed_version.json').write_text(
              json.dumps({'version': ${{ steps.check.outputs.remote_version }}})
          )
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_processed_version.json
          git commit -m "chore: dataset atualizado para versão ${{ steps.check.outputs.remote_version }}" || echo "nada pra commitar"
          git push

      - name: Cria issue avisando falha de validação
        if: steps.check.outputs.has_update == 'true' && steps.validate.outputs.validation_passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const reasons = `${{ steps.validate.outputs.failure_reasons }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Validação falhou — nova versão do dataset NÃO foi publicada',
              body: `A versão ${{ steps.check.outputs.remote_version }} do dataset Kaggle veio com problema(s) de qualidade e a release automática foi bloqueada:\n\n${reasons}\n\nO estado de "última versão processada" NÃO foi avançado -- o workflow vai tentar de novo automaticamente na próxima execução agendada, ou você pode investigar manualmente e rodar de novo.`,
              labels: ['validation-failed']
            });